name: hatofit
description: "A mobile application for fitness tracking and workout planning."
publish_to: "none"
version: 1.1.1+11

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  better_player_plus: ^1.0.8
  cached_network_image: ^3.4.1
  circular_countdown_timer: ^0.2.4
  dartz: ^0.10.1
  device_info_plus: ^11.3.0
  dio: ^5.8.0+1
  dio_smart_retry: ^7.0.1
  firebase_analytics: ^11.4.2
  firebase_core: ^3.11.0
  firebase_crashlytics: ^4.3.2
  firebase_remote_config: ^5.4.0
  flutter_bloc: ^9.0.0
  flutter_blue_plus: ^1.35.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  freezed_annotation: ^2.4.4
  functional_data: ^1.2.0
  get_it: ^8.0.3
  go_router: ^14.7.2
  google_sign_in: ^6.2.2
  hive_flutter: ^1.1.0
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  keep_screen_on: ^4.0.0
  liquid_swipe: ^3.1.0
  logger: ^2.5.0
  oktoast: ^3.4.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  pinput: ^5.0.1
  polar: ^7.5.1
  pretty_dio_logger: ^1.4.0
  syncfusion_flutter_charts: ^28.2.4+1
  syncfusion_flutter_gauges: ^28.2.4
  vibration: ^3.1.2
  video_player: ^2.9.2
  youtube_explode_dart: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  functional_data_generator: ^2.2.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icons/hatofit.png"
  min_sdk_android: 28

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/logo/
    - assets/images/polar/
    - assets/images/avatar/
    - assets/images/icons/
    - assets/videos/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
